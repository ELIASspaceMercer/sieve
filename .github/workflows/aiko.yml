name: AIKO report checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aiko-lint-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run AIKO unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lint starter report (not a release gate)
        run: python3 scripts/check_aiko.py templates/aiko-report.json --mode lint
